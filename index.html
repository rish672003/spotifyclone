<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="utility.css" />
  <title>Spotify - Web Player for music</title>
</head>

<body>
  <div class="container flex bg-black">
    <div class="left">
      <div class="close">
        <img width="30" class="invert" src="images/closeicon.svg" alt="">
      </div>
      <div class="home bg-grey rounded m-1 p-1">
        <div class="logo">
          <img width="150" class="invert" src="images/logo.svg" alt="" />
        </div>
        <ul>
          <li><img class="invert" src="images/home.svg" alt="home" />Home</li>
          <li>
            <img class="invert" src="images/search.svg" alt="home" />search
          </li>
        </ul>
      </div>
      <div class="library bg-grey rounded m-1 p-1">
        <div class="heading">
          <img class="invert" src="images/books.svg" alt="">
          <h2>Your library</h2>

        </div>
        <div class="songList">
          <ul>
            <li>
              <img class="invert" src="images/music.svg" alt="">
              <div class="info">
                <div>Song Name</div>
                <div>Song Artist</div>
              </div>
              <div class="playnow">
                <span> Play Now </span>

                <img class="invert" src="images/play.svg" alt="">

              </div>
            </li>
          </ul>
        </div>
        <div class="footer">

          <div><a href="https://www.spotify.com/in-en/legal/"><span>Legal</span></a></div>
          <div><a href="https://www.spotify.com/in-en/safetyandprivacy/"><span>Safety &amp; Privacy Center</span></a>
          </div>
          <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/"><span>Privacy Policy</span></a></div>
          <div><a href="https://www.spotify.com/in-en/legal/cookies-policy/"><span>Cookies</span></a></div>
          <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
          <div><a href="https://www.spotify.com/in-en/accessibility/"><span>Accessibility</span></a></div>


        </div>
      </div>

    </div>
    <div class="right bg-grey rounded">
      <div class="header">

        <div class="nav">
          <div class="hamburgercontainer">

            <img width="40" class="invert hamburger" src="images/hamburger.svg" alt="">

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#ffffff"
              fill="none">
              <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#ffffff"
              fill="none">
              <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>

        </div>
        <div class="buttons">
          <button class="signupbtn">Sign up</button>
          <button class="loginbtn">Log in</butt on>

        </div>
      </div>
      <div class="spotifyPlaylist">
        <h2>Spotify Playlist</h2>
        <div class="cardcontiner">
          <div class="card">
            <div class="play">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="24" height="24" fill="none">

                <circle cx="14" cy="14" r="10" stroke="black" stroke-width="1.5" />
                <path
                  d="M11.5 13.1998V14.8002C11.5 16.3195 11.5 17.0791 11.9558 17.3862C12.4115 17.6932 13.0348 17.3535 14.2815 16.6741L15.7497 15.8738C17.2499 15.0562 18 14.6474 18 14C18 13.3526 17.2499 12.9438 15.7497 12.1262L14.2815 11.3259C13.0348 10.6465 12.4115 10.3068 11.9558 10.6138C11.5 10.9209 11.5 11.6805 11.5 13.1998Z"
                  fill="black" />
              </svg>


            </div>
            <img src="images\songninefourtyfive.jpg" alt="">
            <h2>9:45 </h2>
            <p>Prabh Singh, Jay Trak</p>
          </div>
          <div class="card">
            <img src="https://i.scdn.co/image/ab67616d00001e026404721c1943d5069f0805f3" alt="">
            <h2>Aashiqui 2</h2>
            <p>Mithoon, Ankit Tiwari, jeet Gangui</p>
          </div>
        </div>
        <div class="playbar">
          <div class="seekbar">
            <div class="circle">

            </div>
          </div>
          <div class="abovebar">

            <div class="songinfo">

            </div>
            <div class="songbutton">
              <img width="25px" id="previous" src="/images/previous.svg" alt="">
              <img width="25px" id="play" src="images/pause.svg" alt="">
              <img width="25px" id="next" src="images/next.svg" alt="">
            </div>
            <div class="timevol">

              <div class="songtime">

              </div>
              <div class="volume">

                <img width="25" src="images\volume.svg" alt="">
                <div class="range">
                  <input type="range" name="volume">
                </div>

              </div>
            </div>
          </div>

        </div>

      </div>





    </div>
  </div>
  </div>
  <script src="scipt.js"></script>
</body>

</html>
